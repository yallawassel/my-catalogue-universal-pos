<script>

function setupBusinessInstall(biz,page){
  const slug=String(biz?.slug||new URLSearchParams(location.search).get('shop')||'').trim();
  const name=String(biz?.company_name||'My Catalogue').trim();
  const logo=String(biz?.logo_url||'').trim();
  if(!slug)return;
  const start=new URL(page==='admin'?'admin.html':'index.html',location.href);
  start.search='?shop='+encodeURIComponent(slug);start.hash='';
  const fallback=new URL('icon-512.png',location.href).href;
  const buildIcon=()=>new Promise(resolve=>{
    if(!logo){resolve(fallback);return}
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,512,512);const s=Math.min(1,440/Math.max(img.naturalWidth,img.naturalHeight));const w=img.naturalWidth*s,h=img.naturalHeight*s;x.drawImage(img,(512-w)/2,(512-h)/2,w,h);resolve(c.toDataURL('image/png'))}catch(e){resolve(logo)}};
    img.onerror=()=>resolve(logo);img.src=logo;
  });
  buildIcon().then(icon=>{
    const manifest={name,short_name:name.slice(0,20)||'Catalogue',start_url:start.href,scope:new URL('./',location.href).href,display:'standalone',background_color:'#f5f6f8',theme_color:biz.primary_color||'#173f35',description:name+' catalogue and ordering',icons:[{src:icon,sizes:'192x192',type:'image/png',purpose:'any'},{src:icon,sizes:'512x512',type:'image/png',purpose:'any'}]};
    let link=document.querySelector('link[rel="manifest"]')||document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));if(!link.isConnected)document.head.appendChild(link);
    let apple=document.querySelector('link[rel="apple-touch-icon"]')||document.createElement('link');apple.rel='apple-touch-icon';apple.href=icon;if(!apple.isConnected)document.head.appendChild(apple);
    const fav=document.querySelector('link[rel="icon"]');if(fav)fav.href=icon;
    document.title=name+(page==='admin'?' · Admin':' · Catalogue');
  });
}
function setupInstallButton(id){
  const btn=document.getElementById(id);if(!btn)return;
  let promptEvent=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});
  btn.addEventListener('click',async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null}else alert('Install: open the browser menu and choose Add to Home screen / Install app. On iPhone or iPad, use Share → Add to Home Screen.')});
}

(()=>{const $=id=>document.getElementById(id);if(!window.MC||!MC.sb){$('empty').hidden=false;$('empty').textContent='Catalogue could not start because saas.js did not load. Keep saas.js beside index.html and open the deployed HTTPS catalogue link.';return}const {sb,esc,resolveBusiness,money}=MC;let biz=null,products=[],cart=[],activeCategory='',lat=null,lng=null,selected={},categoryImages={},categorySortOrder={};const price=(p,unit)=>{const v=unit===1?p.price1:p.price2;return v===null||v===undefined||String(v).trim()===''?NaN:Number(v)};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function fmt(v){return money(v,biz?.currency||'USD')}function priced(p){return p.price1!=null||p.price2!=null}function cover(p){return p.price1==null&&p.price2==null}function setBrand(){const appleIcon=document.querySelector('link[rel="apple-touch-icon"]');if(appleIcon&&biz.logo_url)appleIcon.href=biz.logo_url;setupBusinessInstall(biz,'catalogue');setupInstallButton('installCatalogue');document.body.classList.remove('template-classic','template-premium','template-fresh','template-shopify','template-editorial','template-compact','template-list','template-showcase');document.body.classList.add('template-'+(['classic','premium','fresh','shopify','editorial','compact','list','showcase'].includes(biz.catalogue_template)?biz.catalogue_template:'classic'));document.documentElement.style.setProperty('--brand',biz.primary_color||'#173f35');$('company').textContent=biz.company_name;$('subtitle').textContent=biz.description||'';$('footer').textContent=biz.company_name+' · Product catalogue';if(biz.logo_url){$('logo').onerror=()=>{$('logo').hidden=true};$('logo').onload=()=>{$('logo').hidden=false};$('logo').src=biz.logo_url;$('logo').hidden=false}}
function visibleProducts(){const q=$('search').value.toLowerCase().trim();return products.filter(p=>[p.name,p.category,p.description,p.barcode].join(' ').toLowerCase().includes(q))}function renderCategories(){const list=visibleProducts();const cats=[...new Set(list.map(p=>p.category||'Products'))].sort((a,b)=>{const pa=Number(categorySortOrder[a]??999999);const pb=Number(categorySortOrder[b]??999999);return pa-pb||a.localeCompare(b)});const art=c=>{const t=c.toLowerCase();return /kraft|paper|box|carton/.test(t)?'📦':/plastic|nylon|bag/.test(t)?'🛍️':/clean|deterg|soap/.test(t)?'🧴':/food|chocolate|sweet|christmas/.test(t)?'🎁':'▦'};$('categoryBoard').innerHTML=cats.map(c=>`<button class="category-chip" data-category="${esc(c)}">${esc(c)}</button>`).join('');$('categoryGrid').innerHTML=cats.map(c=>{const all=products.filter(p=>(p.category||'Products')===c);const count=all.length;const image=categoryImages[c]||'';return `<button class="category" data-category="${esc(c)}">${image?`<img class="category-cover" src="${esc(image)}" alt="${esc(c)}" loading="lazy">`:`<div class="category-art" aria-hidden="true">${art(c)}</div>`}<div class="info"><div><div class="name">${esc(c)}</div><div class="count">${count} products</div></div></div></button>`}).join('');$('categoryGrid').querySelectorAll('img.category-cover').forEach(img=>{img.onerror=()=>{const c=img.alt||'Products',t=c.toLowerCase(),fallback=/kraft|paper|box|carton/.test(t)?'📦':/plastic|nylon|bag/.test(t)?'🛍️':/clean|deterg|soap/.test(t)?'🧴':/food|chocolate|sweet|christmas/.test(t)?'🎁':'▦';const art=document.createElement('div');art.className='category-art';art.setAttribute('aria-hidden','true');art.textContent=fallback;img.replaceWith(art)}});$('empty').hidden=!!cats.length;if(!cats.length)$('empty').textContent='No products match your search.'}
function renderProducts(){const q=$('search').value.toLowerCase().trim();const list=products.filter(p=>(p.category||'Products')===activeCategory&&([p.name,p.category,p.description,p.barcode].join(' ').toLowerCase().includes(q)));$('products').innerHTML=list.map(p=>{const ix=products.findIndex(x=>x.id===p.id);const options=[[p.label1||'Packet',p.price1,1],[p.label2||'Box',p.price2,2]].filter(x=>x[1]!=null);const sel=selected[p.id]||options[0]?.[2]||1;return `<article class="product">${p.image?`<img src="${esc(p.image)}" loading="lazy" decoding="async" width="600" height="600" alt="${esc(p.name)}" data-zoom="${ix}">`:`<div class="placeholder">${esc(p.name.slice(0,1))}</div>`}<div class="body"><div class="name">${esc(p.name)}</div>${p.sku?`<div class="count">SKU: ${esc(p.sku)}</div>`:(p.barcode?`<div class="count">Barcode: ${esc(p.barcode)}</div>`:'')}${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="priceChoices">${options.length?options.map(([label,value,u])=>`<button class="priceChoice ${sel===u?'active':''}" data-unit="${u}" data-id="${p.id}">${esc(label)}<small>${fmt(value)}</small></button>`).join(''):'<div class="desc">Price on request — contact us for a quotation.</div>'}</div><div class="qtyrow"><button class="qtybtn" data-qty="-1" data-id="${p.id}">−</button><span class="qty" id="qty-${p.id}">1</span><button class="qtybtn" data-qty="1" data-id="${p.id}">+</button></div>${options.length?`<button class="addbtn" data-add="${p.id}">＋ Add to cart</button>`:''}</div></article>`}).join('');$('empty').hidden=!!list.length;if(!list.length){$('empty').textContent='No products in this category match your search.';$('empty').hidden=false}}
function showHome(){activeCategory='';$('categoryView').hidden=false;$('productView').hidden=true;$('empty').hidden=products.length>0;renderCategories()}function showCategory(c){activeCategory=c;$('categoryView').hidden=true;$('productView').hidden=false;$('categoryTitle').textContent=c;$('empty').hidden=true;renderProducts()}function openCategory(c){history.pushState({mcView:'category',category:c},'',location.href);showCategory(c)}$('categoryGrid').onclick=e=>{const b=e.target.closest('[data-category]');if(b)openCategory(b.dataset.category)};$('categoryBoard').onclick=e=>{const b=e.target.closest('[data-category]');if(b)openCategory(b.dataset.category)};$('back').onclick=()=>{if(history.state&&history.state.mcView==='category')history.back();else showHome()};window.addEventListener('popstate',e=>{const st=e.state||{};if(st.mcOverlay==='zoom'){$('zoom').classList.remove('open')}if(st.mcOverlay==='cart'){$('cartModal').classList.remove('open')}if(st.mcView==='category'&&st.category)showCategory(st.category);else showHome()});if(!history.state||!history.state.mcView)history.replaceState({mcView:'home'},'',location.href);$('search').oninput=()=>{$('empty').hidden=true;if($('productView').hidden)renderCategories();else renderProducts()};$('products').onclick=e=>{const u=e.target.closest('[data-unit]'),q=e.target.closest('[data-qty]'),a=e.target.closest('[data-add]'),z=e.target.closest('[data-zoom]');if(u){selected[u.dataset.id]=Number(u.dataset.unit);renderProducts()}if(q){const el=$('qty-'+q.dataset.id);el.textContent=Math.max(1,Math.min(999,Number(el.textContent)+Number(q.dataset.qty)))}if(a){const p=products.find(x=>x.id===a.dataset.add);if(!p)return;const unit=selected[p.id]||((p.price1!=null)?1:2),val=price(p,unit);if(!Number.isFinite(val)){toast('This item has no price. Please contact the business.');return}const label=unit===1?(p.label1||'Packet'):(p.label2||'Box'),qty=Number($('qty-'+p.id)?.textContent||1);const existing=cart.find(x=>x.id===p.id&&x.unit===unit);if(existing)existing.qty+=qty;else cart.push({id:p.id,name:p.name,image:p.image,unit,label,price:val,qty});renderCart();toast('✓ '+qty+' item'+(qty===1?'':'s')+' added to cart')}if(z){history.pushState({...history.state,mcOverlay:'zoom'},'',location.href);$('zoomImg').src=products[Number(z.dataset.zoom)].image;$('zoom').classList.add('open')}};
function renderCart(){$('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);$('cartItems').innerHTML=cart.map((x,i)=>`<div class="cartline">${x.image?`<img src="${esc(x.image)}" alt="">`:'<span>📦</span>'}<div><b>${esc(x.name)}</b><small>${esc(x.label)} · ${fmt(x.price)} × ${x.qty}</small><div style="margin-top:5px"><button class="qtybtn" data-cartqty="-1" data-i="${i}">−</button> <b>${x.qty}</b> <button class="qtybtn" data-cartqty="1" data-i="${i}">+</button></div></div><button class="remove" data-remove="${i}">Remove</button></div>`).join('')||'<div class="empty">Your cart is empty.</div>';$('cartTotal').textContent=fmt(cart.reduce((s,x)=>s+x.qty*x.price,0))}$('cartItems').onclick=e=>{const r=e.target.closest('[data-remove]'),q=e.target.closest('[data-cartqty]');if(r)cart.splice(Number(r.dataset.remove),1);if(q){const x=cart[Number(q.dataset.i)];x.qty+=Number(q.dataset.cartqty);if(x.qty<=0)cart.splice(Number(q.dataset.i),1)}renderCart()};$('cartButton').onclick=()=>{history.pushState({...history.state,mcOverlay:'cart'},'',location.href);$('cartModal').classList.add('open')};$('closeCart').onclick=()=>{if(history.state&&history.state.mcOverlay==='cart')history.back();else $('cartModal').classList.remove('open')};$('cartModal').onclick=e=>{if(e.target===$('cartModal')){if(history.state&&history.state.mcOverlay==='cart')history.back();else $('cartModal').classList.remove('open')}};$('shareLocation').onclick=()=>{if(!navigator.geolocation){$('locationHint').textContent='Location is not supported on this device.';return}$('locationHint').textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;$('locationHint').textContent='Location added. Accuracy about '+Math.round(p.coords.accuracy)+' m.'},e=>{$('locationHint').textContent='Could not get location. You can still enter the delivery address.'},{enableHighAccuracy:true,timeout:15000})};
$('sendOrder').onclick=async()=>{const name=$('customerName').value.trim(),phone=$('customerPhone').value.trim(),address=$('address').value.trim(),notes=$('notes').value.trim();if(!cart.length){$('orderStatus').textContent='Add at least one priced item first.';return}if(!name||!phone){$('orderStatus').textContent='Enter your name and phone number.';return}const to=String(biz.whatsapp||'').replace(/\D/g,'');if(!to){$('orderStatus').textContent='The business has not configured its WhatsApp number. Please contact the business owner.';return}const waWindow=window.open('about:blank','_blank');if(!waWindow){$('orderStatus').textContent='WhatsApp could not open because pop-ups are blocked. Allow pop-ups for this catalogue and try again.';return}const total=cart.reduce((s,x)=>s+x.qty*x.price,0),items=cart.map(x=>({product_id:x.id,name:x.name,unit:x.label,quantity:x.qty,unit_price:x.price,line_total:x.qty*x.price}));$('sendOrder').disabled=true;$('orderStatus').textContent='Saving order and preparing WhatsApp message…';try{const r=await sb.from('mc_saas_orders').insert({business_id:biz.id,customer_name:name,customer_phone:phone,delivery_address:address,delivery_lat:lat,delivery_lng:lng,location_shared:lat!==null,notes,items,currency:biz.currency||'USD',subtotal:total,total});if(r.error)throw r.error;$('orderStatus').textContent='Order saved. Opening WhatsApp…'}catch(e){$('orderStatus').textContent='Could not save the order online, but you can still send it by WhatsApp. '+(e?.message||'')}const lines=[`Order for ${biz.company_name}`,`Customer: ${name}`,`Phone: ${phone}`,address?`Address: ${address}`:'',lat!==null?`Location: https://www.google.com/maps?q=${lat},${lng}`:'',notes?`Notes: ${notes}`:'','',...cart.map(x=>`${x.name} — ${x.qty} ${x.label} × ${fmt(x.price)} = ${fmt(x.qty*x.price)}`),`TOTAL: ${fmt(total)}`].filter(Boolean);const waUrl='https://wa.me/'+to+'?text='+encodeURIComponent(lines.join('\n'));try{waWindow.location.href=waUrl}catch(e){try{waWindow.close()}catch(_){};$('orderStatus').textContent='Could not open WhatsApp. Allow pop-ups and try again.';$('sendOrder').disabled=false;return}cart=[];renderCart();$('sendOrder').disabled=false};
$('closeZoom').onclick=()=>{if(history.state&&history.state.mcOverlay==='zoom')history.back();else $('zoom').classList.remove('open')};$('zoom').onclick=e=>{if(e.target===$('zoom')){if(history.state&&history.state.mcOverlay==='zoom')history.back();else $('zoom').classList.remove('open')}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(history.state&&history.state.mcOverlay)history.back();else{$('zoom').classList.remove('open');$('cartModal').classList.remove('open')}}});
(async()=>{try{biz=await resolveBusiness();if(!biz){$('company').textContent='Catalogue unavailable';$('subtitle').textContent='This business catalogue may not be published or the domain may not be configured.';$('empty').textContent='Open the business link supplied by the business owner, or contact the platform administrator.';return}setBrand();const r=await sb.from('mc_saas_products').select('id,business_id,name,category,description,image,barcode,sku,label1,price1,label2,price2,extra_info,sort_order').eq('business_id',biz.id).eq('is_active',true).order('sort_order').order('name');if(r.error)throw r.error;products=r.data||[];try{const cr=await sb.from('mc_saas_categories').select('name,image_url,sort_order').eq('business_id',biz.id);if(!cr.error){categoryImages=Object.fromEntries((cr.data||[]).filter(x=>x.image_url).map(x=>[x.name,x.image_url]));categorySortOrder=Object.fromEntries((cr.data||[]).map(x=>[x.name,x.sort_order]));}}catch(e){}renderCategories();$('empty').hidden=products.length>0;if(!products.length)$('empty').textContent='This catalogue has no products yet.'}catch(e){console.error(e);$('empty').textContent='Could not load catalogue. Check the published business, Supabase read policies and internet connection.'}})();
})();
</script></body></html>
