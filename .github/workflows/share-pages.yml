name: share-pages
# Rebuilds myraffi.com/s/<slug>/ link-preview pages for every published catalogue.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: share-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-share-pages.mjs s
      - name: Commit if changed
        run: |
          git add -A s
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="raffi-bot" -c user.email="actions@users.noreply.github.com" commit -m "Update shop share pages"
          git push
