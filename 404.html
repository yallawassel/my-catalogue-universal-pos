<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raffi | رفّي</title>
<script>
// A shop link like /s/<slug>/ that has no page yet (new shop): open the catalogue directly.
(function(){var m=location.pathname.match(/\/s\/([a-z0-9][a-z0-9-]{0,79})\/?$/i);if(m){location.replace('/index.html?shop='+encodeURIComponent(m[1].toLowerCase())+(location.search?'&'+location.search.slice(1):'')+location.hash)}})();
</script>
